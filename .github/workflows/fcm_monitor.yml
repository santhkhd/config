name: Firebase FCM Push Notifications

on:
  schedule:
    - cron: '15 * * * *' # Runs at minute 15 of every hour
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

jobs:
  fcm-broadcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r automation/requirements.txt

      - name: Run Firebase FCM Monitor
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          python automation/fcm_monitor.py

      - name: Commit and Push State (Update FCM tracking state)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add automation/state/last_seen_fcm_*.json
          git commit -m "Update FCM state [skip ci]" || echo "No FCM state changes to commit"
          git pull --rebase
          git push
